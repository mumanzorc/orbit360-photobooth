services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: https://localhost:8867
      SECURE_COOKIE: "false"
      DATA_DIR: /app/data
      MEDIA_DIR: /app/public/media
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
    volumes:
      - booth_data:/app/data
      - booth_media:/app/public/media
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["8867:8867"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  booth_data:
  booth_media:
  caddy_data:
